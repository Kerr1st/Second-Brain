# Per-machine model-backend profiles for the dream cycle.
#
# Each role maps to (backend, model, effort). Select a profile with the
# SECOND_BRAIN_PROFILE env var; unset => `default_profile` below.
#
# The `laptop` profile reproduces today's behavior exactly (all-Kiro / Opus 4.8,
# $0 metered). The `mini` profile targets the Mac Mini (Claude Code on Bedrock);
# its adapter lands in a later step, so selecting it errors until then.
#
# Credentials are NOT stored here — they stay out-of-band / gitignored.
# See docs/MODEL-BACKENDS.md.

default_profile = "laptop"

[profiles.laptop]
explorer       = { backend = "kiro", model = "claude-opus-4.8", effort = "high" }
thinker        = { backend = "kiro", model = "claude-opus-4.8", effort = "max" }
skeptic        = { backend = "kiro", model = "claude-opus-4.8", effort = "high" }
advocate       = { backend = "kiro", model = "claude-opus-4.8", effort = "high" }
epistemologist = { backend = "kiro", model = "claude-opus-4.8", effort = "high" }
methodologist  = { backend = "kiro", model = "claude-opus-4.8", effort = "high" }

[profiles.mini]
# Mac Mini: no Kiro -> Claude Code on Bedrock. The claude_code adapter is
# implemented and validated end-to-end against the local enterprise-managed `claude` build.
#
# Model ids are Bedrock inference-profile ids the Claude Code CLI accepts on
# this build (confirmed live): `global.anthropic.claude-opus-4-8` is the latest
# Opus. The short/dotted forms (`claude-opus-4.8`, `claude-opus-4-8`) and the
# `opus` alias (which resolves to the older 4-6) are NOT used. For a cheaper /
# faster instance, swap to `global.anthropic.claude-sonnet-4-6`.
explorer       = { backend = "claude_code", model = "global.anthropic.claude-opus-4-8", effort = "high" }
thinker        = { backend = "claude_code", model = "global.anthropic.claude-opus-4-8", effort = "max" }
skeptic        = { backend = "claude_code", model = "global.anthropic.claude-opus-4-8", effort = "high" }
advocate       = { backend = "claude_code", model = "global.anthropic.claude-opus-4-8", effort = "high" }
epistemologist = { backend = "claude_code", model = "global.anthropic.claude-opus-4-8", effort = "high" }
methodologist  = { backend = "claude_code", model = "global.anthropic.claude-opus-4-8", effort = "high" }
