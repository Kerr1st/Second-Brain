# Capture liveness policy — read by `python -m src.operations.liveness`
# (invoked from scripts/jobs/verify_liveness.sh, launchd label com.second-brain.liveness, 09:00).
#
# Severity vocabulary (the job's exit code follows `required` only):
#   required  ❌  silence beyond max_age_days fails the job and notifies
#   advisory  ⚠   watched and reported, never fails the job — for channels whose
#                 producer is KNOWN to be disabled/failing (listed here explicitly,
#                 with the reason, instead of being hard-coded or silently dropped)
#   retired   ⚠   dormant upstream; kept visible on purpose, never fails
#
# Thresholds are DAYS and were set from observed cadence on 2026-09-23 (see the
# header of scripts/jobs/verify_liveness.sh); R5 keeps every production threshold
# unchanged and only ADDS channels/predicates.

[channels.quick_desktop_doc]
predicate = "source_type = 'quick_desktop_doc'"
max_age_days = 3
severity = "retired"
reason = "upstream Quick doc export dormant since 2026-06-04; re-arm (severity = required) if it resumes"

[channels.quick_desktop_synth]
predicate = "source_type LIKE 'quick_desktop_%' AND source_type NOT IN ('quick_desktop_doc','quick_desktop_session_event')"
max_age_days = 21
severity = "required"

[channels.web_articles]
predicate = "source_type = 'article'"
max_age_days = 9
severity = "required"

[channels.ide_chat]
# Re-armed in R5: R4's chat-capture job captures native Kiro IDE sessions nightly
# (the channel had been dark since 2026-05-17 and was excluded from this list).
predicate = "source_type = 'kiro_ide_chat'"
max_age_days = 7
severity = "required"

[channels.cli_chat]
predicate = "source_type = 'kiro_cli_chat'"
max_age_days = 4
severity = "required"

[channels.youtube]
predicate = "source_type = 'youtube'"
max_age_days = 9
severity = "required"

[channels.outlook_email]
predicate = "source_type = 'outlook_email'"
max_age_days = 3
severity = "required"

[channels.outlook_calendar]
predicate = "source_type = 'outlook_calendar'"
max_age_days = 5
severity = "required"

[channels.slack]
predicate = "source_type = 'slack'"
max_age_days = 4
severity = "required"

[channels.browser_history]
predicate = "source_type = 'browser_history'"
max_age_days = 4
severity = "required"

[channels.codex_task]
predicate = "source_type = 'codex_task'"
max_age_days = 7
severity = "required"

# --- known-disabled / known-failing producers: watched, advisory (E-N6) -------
# Flip `severity` to "required" when the producer is re-enabled and has produced
# once; until then a ❌ here would make the monitor red from day one and unread.

[channels.distilled_chat]
predicate = "source_type = 'distilled_chat'"
max_age_days = 7
severity = "advisory"
reason = "com.second-brain.distill is launchctl-disabled by the operator (since 2026-09-22); silent since then"

[channels.weekly_digest]
predicate = "source_type = 'weekly_digest'"
max_age_days = 14
severity = "advisory"
reason = "weekly_digest.sh has failed every Monday since 2026-09-07 (Bedrock EndpointConnectionError, exit 1); its wrapper status is swept below"

# --- generic zero-output predicate ----------------------------------------------
# Every source_type that has EVER produced a row is checked, enumerated or not:
# "produced zero rows for longer than its own cadence tolerates".  The tolerance is
# learned from history: max observed gap between capture days in the look-back
# window, plus one day, floored at `min_silent_days_*`.  This is the rule that
# would have caught kiro_ide_chat's death on 2026-05-17 (not enumerated → nobody
# looked) and the Slack rate-limit gap of 2026-10-03/04 (enumerated threshold 4 d,
# daily cadence → zero for 2 days is already abnormal).
#   enumerated channels  → advisory ⚠ (their fixed threshold above stays the ❌ rule)
#   unenumerated types   → required ❌ after `min_silent_days_required`
[zero_output]
history_days = 90
min_silent_days_advisory = 2
min_silent_days_required = 7
# an enumerated type needs this many capture days in the window before its cadence
# counts as learned (sparse quick_desktop_* types otherwise flap as ⚠ daily)
min_history_days_advisory = 10
# never flagged: retired/one-time/known-disabled producers and synthesis outputs.
# "quick_desktop" (bare) is a legacy label — 10 rows, last written 2026-06-30; the
# live QD stages write quick_desktop_<kind>, which the LIKE predicate enumerates.
ignore = [
  "quick_desktop_doc", "quick_desktop_session_event", "quick_desktop",
  "distilled_chat", "distilled_agent_task", "weekly_digest",
  "dream_cycle", "manual", "file",
]

# --- dream cycle --------------------------------------------------------------
[dream_cycle]
# Runs Mon/Wed/Fri 02:00; the longest normal gap is Fri→Mon = 3 d.  7 d means two
# consecutive scheduled runs never completed (completed_at stays NULL on a crash).
max_completed_age_days = 7
# A completed run that generated 0 candidates (observed 2026-09-30) is not healthy
# output; `zero_candidate_runs_required` consecutive ones fail the job.
zero_candidate_runs_required = 2

# --- scheduled-job status sweep (logs/jobs/<name>.json written by the wrapper) ---
# `expected_interval_hours`: the longest normal gap between two status updates for
# that job (schedule period + its own deadline + slack).  A status file older than
# that means the job has not even been *started* by launchd — a plist that is not
# loaded, a copy pointing at a deleted script, or a Mac that was asleep.
# `failure_days`: a non-zero last exit is ❌ once it has persisted this long.
# 0 = report it at the next sweep (the job already notified when it failed; the
# 09:00 sweep is the durable second look for a headless morning). Raise to 1 to
# tolerate a single flaky night as ⚠.
[jobs]
failure_days = 0

[jobs.expected_interval_hours]
backup = 30            # daily 02:00 (+2 h deadline)
bookmarks = 192        # Sat 01:00 → 8 d
capture-browser = 30
capture-outlook = 30
capture-slack = 30
chat-capture = 30
crawlee-ingest = 30
codex-capture = 12     # every 6 h
credentials = 30
dream-cycle = 96       # Mon/Wed/Fri → Fri→Mon is 72 h, + 6 h deadline + slack
liveness = 30
qd-sync = 6            # hourly
verify = 192           # Sun 03:00
weekly-digest = 192    # Mon 06:00
youtube = 30
# capture-api is a KeepAlive service: judged on its heartbeat, not an interval.
# distill is launchctl-disabled: no status file is expected; not listed on purpose.
