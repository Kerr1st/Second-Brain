services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: second-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory_bank
      POSTGRES_PASSWORD: memory_bank
      POSTGRES_DB: memory_bank
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data:/var/lib/postgresql/data
