services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: second-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory_bank
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a unique development database password}
      POSTGRES_DB: memory_bank
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/data:/var/lib/postgresql/data
